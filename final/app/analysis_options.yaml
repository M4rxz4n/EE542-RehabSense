include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # A missed await in a BLE flow is a race. Enabled as a lint rather than
    # escalated to an error: the places that intentionally fire and forget
    # (closing a server during dispose, opening system settings) are marked
    # with unawaited() in the source, and a hard error here would stop the
    # build over style on a demo day.
    unawaited_futures: true

    avoid_print: true
    use_super_parameters: true
    prefer_final_locals: true

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

  exclude:
    # Generated by `flutter create`. Not ours to lint.
    - android/**
    - ios/**
    - build/**
